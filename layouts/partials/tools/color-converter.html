{{- $zh := eq site.Language.Lang "zh-cn" }}
<div class="mt-5 bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-2xl shadow-sm dark:shadow-xl dark:shadow-black/20 overflow-hidden transition-colors duration-200" id="cc-tool">
  <!-- Tool header -->
  <div class="border-b border-slate-100 dark:border-zinc-800 px-4 sm:px-5 py-3 flex flex-wrap items-center justify-between gap-3">
    <div class="flex items-center gap-2">
      <span class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-brand-50 dark:bg-brand-500/10 text-brand-600 dark:text-brand-400 font-mono text-sm font-bold">RGB</span>
      <span class="text-sm font-semibold text-slate-800 dark:text-zinc-200">{{ if $zh }}颜色转换器{{ else }}Color Converter{{ end }}</span>
      <span class="text-xs text-slate-400 dark:text-zinc-500">{{ if $zh }}交互工具{{ else }}Interactive Tool{{ end }}</span>
    </div>
    <div class="flex items-center gap-2">
      <button id="cc-layout" type="button" title="{{ if $zh }}切换布局{{ else }}Toggle layout{{ end }}"
              class="inline-flex items-center gap-1.5 text-sm font-medium text-slate-600 dark:text-zinc-300 border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 hover:border-brand-400 px-3 py-1.5 rounded-lg transition-colors">
        <svg id="cc-layout-stack" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 4h14v6H5z M5 14h14v6H5z"/></svg>
        <svg id="cc-layout-col" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 4h6v16H5z M13 4h6v16h-6z"/></svg>
      </button>
      <button id="cc-fullscreen" type="button" title="{{ if $zh }}切换全屏{{ else }}Toggle fullscreen{{ end }}"
              class="inline-flex items-center gap-1.5 text-sm font-medium text-slate-600 dark:text-zinc-300 border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 hover:border-brand-400 px-3 py-1.5 rounded-lg transition-colors">
        <svg id="cc-fs-enter" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V6a2 2 0 012-2h2M20 8V6a2 2 0 00-2-2h-2M4 16v2a2 2 0 002 2h2M20 16v2a2 2 0 01-2 2h-2"/></svg>
        <svg id="cc-fs-exit" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 4v4H4M16 4v4h4M8 20v-4H4M16 20v-4h4"/></svg>
      </button>
    </div>
  </div>

  <div id="cc-panels" class="flex flex-col lg:flex-row lg:items-start">
    <!-- Left: inputs -->
    <div id="cc-left" class="flex flex-col lg:flex-1 border-b lg:border-b-0 lg:border-r border-slate-100 dark:border-zinc-800">
      <div class="px-4 sm:px-5 pt-3 pb-2 flex flex-wrap items-center gap-1.5 border-b border-slate-100 dark:border-zinc-800">
        <span class="text-xs font-semibold uppercase tracking-wide text-slate-400 dark:text-zinc-500 mr-2">{{ if $zh }}输入颜色{{ else }}Input color{{ end }}</span>
        <input id="cc-picker" type="color" value="#2d6d5c" class="w-9 h-9 rounded-lg border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 p-1 cursor-pointer transition-colors" title="{{ if $zh }}拾色器{{ else }}Color picker{{ end }}" />
      </div>
      <div class="px-4 sm:px-5 py-3 flex flex-col gap-2.5">
        <div class="flex items-center gap-2">
          <span class="text-xs font-semibold uppercase tracking-wide text-slate-400 dark:text-zinc-500 w-12 shrink-0">HEX</span>
          <input id="cc-hex" type="text" spellcheck="false" value="#2d6d5c" placeholder="#RRGGBB"
                 class="flex-1 rounded-lg border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 px-3 py-1.5 font-mono text-sm text-slate-700 dark:text-zinc-200 focus:outline-none focus:ring-2 focus:ring-brand-500 transition-colors" />
        </div>
        <div class="flex items-center gap-2">
          <span class="text-xs font-semibold uppercase tracking-wide text-slate-400 dark:text-zinc-500 w-12 shrink-0">RGB</span>
          <input id="cc-rgb" type="text" spellcheck="false" value="45, 109, 92" placeholder="R, G, B"
                 class="flex-1 rounded-lg border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 px-3 py-1.5 font-mono text-sm text-slate-700 dark:text-zinc-200 focus:outline-none focus:ring-2 focus:ring-brand-500 transition-colors" />
        </div>
        <div class="flex items-center gap-2">
          <span class="text-xs font-semibold uppercase tracking-wide text-slate-400 dark:text-zinc-500 w-12 shrink-0">HSL</span>
          <input id="cc-hsl" type="text" spellcheck="false" value="161, 42%, 30%" placeholder="H, S%, L%"
                 class="flex-1 rounded-lg border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 px-3 py-1.5 font-mono text-sm text-slate-700 dark:text-zinc-200 focus:outline-none focus:ring-2 focus:ring-brand-500 transition-colors" />
        </div>
      </div>
    </div>

    <!-- Resizer -->
    <div id="cc-resizer" role="separator" aria-label="{{ if $zh }}拖动调整面板宽度{{ else }}Drag to resize panels{{ end }}" class="hidden lg:flex self-stretch group w-2.5 cursor-col-resize items-center justify-center transition-colors" style="touch-action:none;">
      <span class="flex flex-col gap-1.5" aria-hidden="true">
        <span class="w-1.5 h-1.5 rounded-full bg-slate-400 dark:bg-zinc-500 group-hover:bg-brand-500 dark:group-hover:bg-brand-400 transition-colors"></span>
        <span class="w-1.5 h-1.5 rounded-full bg-slate-400 dark:bg-zinc-500 group-hover:bg-brand-500 dark:group-hover:bg-brand-400 transition-colors"></span>
        <span class="w-1.5 h-1.5 rounded-full bg-slate-400 dark:bg-zinc-500 group-hover:bg-brand-500 dark:group-hover:bg-brand-400 transition-colors"></span>
        <span class="w-1.5 h-1.5 rounded-full bg-slate-400 dark:bg-zinc-500 group-hover:bg-brand-500 dark:group-hover:bg-brand-400 transition-colors"></span>
        <span class="w-1.5 h-1.5 rounded-full bg-slate-400 dark:bg-zinc-500 group-hover:bg-brand-500 dark:group-hover:bg-brand-400 transition-colors"></span>
      </span>
    </div>

    <!-- Right: preview + values -->
    <div id="cc-right" class="flex flex-col lg:flex-[1.4] min-h-0">
      <div class="px-4 sm:px-5 pt-3 pb-2 flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 dark:border-zinc-800">
        <span class="text-xs font-semibold uppercase tracking-wide text-slate-400 dark:text-zinc-500">{{ if $zh }}预览与转换{{ else }}Preview & converted values{{ end }}</span>
        <div class="flex items-center gap-1.5">
          <button id="cc-copy" type="button" class="jt-icon-btn" title="{{ if $zh }}复制输出{{ else }}Copy output{{ end }}">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
          </button>
        </div>
      </div>
      <div id="cc-statusbar" class="px-4 sm:px-5 pt-2 text-xs flex flex-wrap items-center gap-x-3 gap-y-1 min-h-6">
        <span id="cc-status" class="text-slate-400 dark:text-zinc-500"></span>
      </div>
      <div class="px-4 sm:px-5 py-4 flex flex-col gap-4">
        <div id="cc-swatch" class="h-28 rounded-xl border border-slate-200 dark:border-zinc-700 transition-colors duration-150" style="background:#2d6d5c;"></div>
        <textarea id="cc-output" rows="10" readonly spellcheck="false" class="jt-editor jt-output-readonly" style="min-height:180px;"></textarea>
      </div>
    </div>
  </div>
</div>
<script src="/js/color-converter.js?v=1" defer></script>
