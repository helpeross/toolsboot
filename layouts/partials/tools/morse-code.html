{{- $zh := eq site.Language.Lang "zh-cn" }}
<div class="mt-5 bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-2xl shadow-sm dark:shadow-xl dark:shadow-black/20 overflow-hidden transition-colors duration-200" id="morse-tool">
  <!-- Tool header -->
  <div class="border-b border-slate-100 dark:border-zinc-800 px-4 sm:px-5 py-3 flex flex-wrap items-center justify-between gap-3">
    <div class="flex items-center gap-2">
      <span class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-brand-50 dark:bg-brand-500/10 text-brand-600 dark:text-brand-400 font-mono text-sm font-bold">·—</span>
      <span class="text-sm font-semibold text-slate-800 dark:text-zinc-200">{{ if $zh }}摩斯电码{{ else }}Morse Code{{ end }}</span>
      <span class="text-xs text-slate-400 dark:text-zinc-500">{{ if $zh }}交互工具{{ else }}Interactive Tool{{ end }}</span>
    </div>
    <div class="flex items-center gap-2">
      <button id="morse-layout" type="button" title="{{ if $zh }}切换布局{{ else }}Toggle layout{{ end }}"
              class="inline-flex items-center gap-1.5 text-sm font-medium text-slate-600 dark:text-zinc-300 border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 hover:border-brand-400 px-3 py-1.5 rounded-lg transition-colors">
        <svg id="morse-layout-stack" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 4h14v6H5z M5 14h14v6H5z"/></svg>
        <svg id="morse-layout-col" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 4h6v16H5z M13 4h6v16h-6z"/></svg>
      </button>
      <button id="morse-fullscreen" type="button" title="{{ if $zh }}切换全屏{{ else }}Toggle fullscreen{{ end }}"
              class="inline-flex items-center gap-1.5 text-sm font-medium text-slate-600 dark:text-zinc-300 border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 hover:border-brand-400 px-3 py-1.5 rounded-lg transition-colors">
        <svg id="morse-fs-enter" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V6a2 2 0 012-2h2M20 8V6a2 2 0 00-2-2h-2M4 16v2a2 2 0 002 2h2M20 16v2a2 2 0 01-2 2h-2"/></svg>
        <svg id="morse-fs-exit" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 4v4H4M16 4v4h4M8 20v-4H4M16 20v-4h4"/></svg>
      </button>
    </div>
  </div>

  <div id="morse-panels" class="flex flex-col lg:flex-row lg:items-start">
    <!-- Left: input -->
    <div id="morse-left" class="flex flex-col lg:flex-1 border-b lg:border-b-0 lg:border-r border-slate-100 dark:border-zinc-800">
      <div class="px-4 sm:px-5 pt-3 pb-2 flex flex-wrap items-center gap-1.5 border-b border-slate-100 dark:border-zinc-800">
        <button id="morse-mode-enc" type="button" class="jt-mode active">{{ if $zh }}文本 → 摩斯{{ else }}Text → Morse{{ end }}</button>
        <button id="morse-mode-dec" type="button" class="jt-mode">{{ if $zh }}摩斯 → 文本{{ else }}Morse → Text{{ end }}</button>
        <button id="morse-paste" type="button" class="jt-icon-btn ml-auto" title="{{ if $zh }}粘贴到输入框{{ else }}Paste into input{{ end }}">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2M12 12v6m0 0l-3-3m3 3l3-3"/></svg>
        </button>
      </div>
      <textarea id="morse-input" rows="22" spellcheck="false"
                placeholder="{{ if $zh }}输入文本或摩斯码…{{ else }}Type text or Morse code...{{ end }}"
                class="jt-editor"></textarea>
    </div>

    <!-- Resizer -->
    <div id="morse-resizer" role="separator" aria-label="{{ if $zh }}拖动调整面板宽度{{ else }}Drag to resize panels{{ end }}" class="hidden lg:flex self-stretch group w-2.5 cursor-col-resize items-center justify-center transition-colors" style="touch-action:none;">
      <span class="flex flex-col gap-1.5" aria-hidden="true">
        <span class="w-1.5 h-1.5 rounded-full bg-slate-400 dark:bg-zinc-500 group-hover:bg-brand-500 dark:group-hover:bg-brand-400 transition-colors"></span>
        <span class="w-1.5 h-1.5 rounded-full bg-slate-400 dark:bg-zinc-500 group-hover:bg-brand-500 dark:group-hover:bg-brand-400 transition-colors"></span>
        <span class="w-1.5 h-1.5 rounded-full bg-slate-400 dark:bg-zinc-500 group-hover:bg-brand-500 dark:group-hover:bg-brand-400 transition-colors"></span>
        <span class="w-1.5 h-1.5 rounded-full bg-slate-400 dark:bg-zinc-500 group-hover:bg-brand-500 dark:group-hover:bg-brand-400 transition-colors"></span>
        <span class="w-1.5 h-1.5 rounded-full bg-slate-400 dark:bg-zinc-500 group-hover:bg-brand-500 dark:group-hover:bg-brand-400 transition-colors"></span>
      </span>
    </div>

    <!-- Right: output -->
    <div id="morse-right" class="flex flex-col lg:flex-[1.4] min-h-0">
      <div class="px-4 sm:px-5 pt-3 pb-2 flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 dark:border-zinc-800">
        <div class="flex items-center gap-2">
          <span class="text-xs font-semibold uppercase tracking-wide text-slate-400 dark:text-zinc-500">{{ if $zh }}输出{{ else }}Output{{ end }}</span>
          <label class="flex items-center gap-1.5 text-xs text-slate-600 dark:text-zinc-400 cursor-pointer select-none">
            <input id="morse-live" type="checkbox" checked class="accent-brand-500 w-3.5 h-3.5">
            {{ if $zh }}实时{{ else }}Live{{ end }}
          </label>
        </div>
        <div class="flex items-center gap-1.5">
          <button id="morse-copy" type="button" class="jt-icon-btn" title="{{ if $zh }}复制输出{{ else }}Copy output{{ end }}">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
          </button>
          <button id="morse-clear" type="button" class="jt-icon-btn" title="{{ if $zh }}全部清空{{ else }}Clear all{{ end }}">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
          </button>
        </div>
      </div>
      <div id="morse-statusbar" class="px-4 sm:px-5 pt-2 text-xs flex flex-wrap items-center gap-x-3 gap-y-1 min-h-6">
        <span id="morse-status" class="text-slate-400 dark:text-zinc-500"></span>
      </div>
      <textarea id="morse-output" rows="22" readonly spellcheck="false"
                placeholder="{{ if $zh }}转换结果将显示在这里…{{ else }}Converted result will appear here...{{ end }}"
                class="jt-editor jt-output-readonly"></textarea>
    </div>
  </div>
</div>
<script src="/js/morse-code.js?v=1" defer></script>
