{{- $zh := eq site.Language.Lang "zh-cn" }}
<div class="mt-5 bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-2xl shadow-sm dark:shadow-xl dark:shadow-black/20 overflow-hidden transition-colors duration-200" id="json-tool">
  <!-- Tool header -->
  <div class="border-b border-slate-100 dark:border-zinc-800 px-4 sm:px-5 py-3 flex flex-wrap items-center justify-between gap-3">
    <div class="flex items-center gap-2">
      <span class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-brand-50 dark:bg-brand-500/10 text-brand-600 dark:text-brand-400 font-mono text-sm font-bold">{ }</span>
      <span class="text-sm font-semibold text-slate-800 dark:text-zinc-200">{{ if $zh }}JSON 格式化{{ else }}JSON Formatter{{ end }}</span>
      <span class="text-xs text-slate-400 dark:text-zinc-500">{{ if $zh }}交互工具{{ else }}Interactive Tool{{ end }}</span>
    </div>
    <div class="flex items-center gap-2">
    <!-- Fullscreen toggle -->
    <button id="jt-fullscreen" type="button" title="{{ if $zh }}切换全屏{{ else }}Toggle fullscreen{{ end }}"
            class="inline-flex items-center gap-1.5 text-sm font-medium text-slate-600 dark:text-zinc-300 border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 hover:border-brand-400 px-3 py-1.5 rounded-lg transition-colors">
      <svg id="jt-fs-enter" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V6a2 2 0 012-2h2M20 8V6a2 2 0 00-2-2h-2M4 16v2a2 2 0 002 2h2M20 16v2a2 2 0 01-2 2h-2"/></svg>
      <svg id="jt-fs-exit" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 4v4H4M16 4v4h4M8 20v-4H4M16 20v-4h4"/></svg>
    </button>
    <!-- Options dropdown -->
    <div id="jt-options" class="relative">
      <button id="jt-options-btn" type="button"
              class="inline-flex items-center gap-1.5 text-sm font-medium text-slate-600 dark:text-zinc-300 border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 hover:border-brand-400 px-3 py-1.5 rounded-lg transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        {{ if $zh }}选项{{ else }}Options{{ end }}
      </button>
      <div id="jt-options-menu" class="hidden absolute right-0 top-full mt-2 w-52 bg-white dark:bg-zinc-800 border border-slate-200 dark:border-zinc-700 rounded-xl shadow-lg dark:shadow-black/30 z-30 py-2">
        <label class="flex items-center justify-between px-3.5 py-2 text-sm text-slate-700 hover:bg-slate-50 dark:text-zinc-300 dark:hover:bg-zinc-700/50 cursor-pointer transition-colors">
          <span>{{ if $zh }}语法着色{{ else }}Syntax coloring{{ end }}</span>
          <input type="checkbox" id="jt-opt-color" checked class="accent-brand-500">
        </label>
        <label class="flex items-center justify-between px-3.5 py-2 text-sm text-slate-700 hover:bg-slate-50 dark:text-zinc-300 dark:hover:bg-zinc-700/50 cursor-pointer transition-colors">
          <span>{{ if $zh }}数组索引{{ else }}Array indices{{ end }}</span>
          <input type="checkbox" id="jt-opt-index" class="accent-brand-500">
        </label>
        <label class="flex items-center justify-between px-3.5 py-2 text-sm text-slate-700 hover:bg-slate-50 dark:text-zinc-300 dark:hover:bg-zinc-700/50 cursor-pointer transition-colors">
          <span>{{ if $zh }}显示类型{{ else }}Show types{{ end }}</span>
          <input type="checkbox" id="jt-opt-type" class="accent-brand-500">
        </label>
        <label class="flex items-center justify-between px-3.5 py-2 text-sm text-slate-700 hover:bg-slate-50 dark:text-zinc-300 dark:hover:bg-zinc-700/50 cursor-pointer transition-colors">
          <span>{{ if $zh }}紧凑视图{{ else }}Compact view{{ end }}</span>
          <input type="checkbox" id="jt-opt-compress" class="accent-brand-500">
        </label>
      </div>
    </div>
    </div>
  </div>

  <!-- Panel container -->
  <div id="jt-panels" class="flex flex-col lg:flex-row lg:items-start">
    <!-- Left: input -->
    <div id="jt-left" class="flex flex-col lg:flex-1 border-b lg:border-b-0 lg:border-r border-slate-100 dark:border-zinc-800">
      <div class="px-4 sm:px-5 pt-3 pb-2 flex flex-wrap items-center gap-1.5 border-b border-slate-100 dark:border-zinc-800">
        <span class="text-xs font-semibold uppercase tracking-wide text-slate-400 dark:text-zinc-500 mr-2">{{ if $zh }}原始输入{{ else }}Raw Input{{ end }}</span>
        <button data-act="format"  class="jt-btn">{{ if $zh }}格式化{{ else }}Format{{ end }}</button>
        <button data-act="minify"  class="jt-btn">{{ if $zh }}压缩{{ else }}Minify{{ end }}</button>
        <button data-act="escape"  class="jt-btn">{{ if $zh }}转义{{ else }}Escape{{ end }}</button>
        <button data-act="unescape" class="jt-btn">{{ if $zh }}反转义{{ else }}Unescape{{ end }}</button>
        <button id="jt-paste" type="button" class="jt-icon-btn ml-auto" title="{{ if $zh }}粘贴到输入框{{ else }}Paste into input{{ end }}">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2M12 12v6m0 0l-3-3m3 3l3-3"/></svg>
        </button>
      </div>
      <textarea id="jt-input" rows="22" spellcheck="false"
                placeholder='{"name":"sample","items":[1,2,3]}'
                class="jt-editor"></textarea>
    </div>

    <!-- Resizer (desktop only) -->
    <div id="jt-resizer" role="separator" aria-label="{{ if $zh }}拖动调整面板宽度{{ else }}Drag to resize panels{{ end }}" class="hidden lg:flex self-stretch group w-2.5 cursor-col-resize items-center justify-center transition-colors" style="touch-action:none;">
      <span class="flex flex-col gap-1.5" aria-hidden="true">
        <span class="w-1.5 h-1.5 rounded-full bg-slate-400 dark:bg-zinc-500 group-hover:bg-brand-500 dark:group-hover:bg-brand-400 transition-colors"></span>
        <span class="w-1.5 h-1.5 rounded-full bg-slate-400 dark:bg-zinc-500 group-hover:bg-brand-500 dark:group-hover:bg-brand-400 transition-colors"></span>
        <span class="w-1.5 h-1.5 rounded-full bg-slate-400 dark:bg-zinc-500 group-hover:bg-brand-500 dark:group-hover:bg-brand-400 transition-colors"></span>
        <span class="w-1.5 h-1.5 rounded-full bg-slate-400 dark:bg-zinc-500 group-hover:bg-brand-500 dark:group-hover:bg-brand-400 transition-colors"></span>
        <span class="w-1.5 h-1.5 rounded-full bg-slate-400 dark:bg-zinc-500 group-hover:bg-brand-500 dark:group-hover:bg-brand-400 transition-colors"></span>
      </span>
    </div>

    <!-- Right: output -->
    <div id="jt-right" class="flex flex-col lg:flex-[1.4] min-h-0">
      <div class="px-4 sm:px-5 pt-3 pb-2 flex items-center justify-between border-b border-slate-100 dark:border-zinc-800">
        <div class="flex items-center gap-1">
          <button id="jt-mode-strict"  type="button" class="jt-mode active">{{ if $zh }}严格{{ else }}Strict{{ end }}</button>
          <button id="jt-mode-relaxed" type="button" class="jt-mode">{{ if $zh }}宽松{{ else }}Relaxed{{ end }}</button>
        </div>
        <div class="flex items-center gap-1.5">
          <button id="jt-copy" type="button" class="jt-icon-btn" title="{{ if $zh }}复制格式化输出{{ else }}Copy formatted output{{ end }}">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
          </button>
          <button id="jt-clear" type="button" class="jt-icon-btn" title="{{ if $zh }}全部清空{{ else }}Clear all{{ end }}">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
          </button>
        </div>
      </div>
      <div id="jt-statusbar" class="px-4 sm:px-5 pt-2 text-xs flex flex-wrap items-center gap-x-3 gap-y-1 min-h-6">
        <div id="jt-status"></div>
        <button id="jt-restore" type="button" class="hidden items-center gap-1 text-xs font-medium text-brand-700 dark:text-brand-400 hover:underline" title="{{ if $zh }}恢复粘贴的原始文本{{ else }}Put the original pasted text back{{ end }}">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a5 5 0 015 5v0a5 5 0 01-5 5H10M3 10l4-4M3 10l4 4"/></svg>
          {{ if $zh }}恢复原文{{ else }}Restore original{{ end }}
        </button>
      </div>
      <div id="jt-output" class="jt-output" tabindex="0"></div>
    </div>
  </div>
</div>
<script src="/js/json-formatter.js?v=8" defer></script>
