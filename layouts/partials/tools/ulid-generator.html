{{- $zh := eq site.Language.Lang "zh-cn" }}
<div class="mt-5 bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-2xl shadow-sm dark:shadow-xl dark:shadow-black/20 overflow-hidden transition-colors duration-200" id="ulid-tool">
  <div class="border-b border-slate-100 dark:border-zinc-800 px-4 sm:px-5 py-3 flex flex-wrap items-center justify-between gap-3">
    <div class="flex items-center gap-2">
      <span class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-brand-50 dark:bg-brand-500/10 text-brand-600 dark:text-brand-400 font-mono text-sm font-bold">UL</span>
      <span class="text-sm font-semibold text-slate-800 dark:text-zinc-200">{{ if $zh }}ULID 生成器{{ else }}ULID Generator{{ end }}</span>
      <span class="text-xs text-slate-400 dark:text-zinc-500">{{ if $zh }}交互工具{{ else }}Interactive Tool{{ end }}</span>
    </div>
    <div class="flex items-center gap-2">
      <button id="ulid-layout" type="button" title="{{ if $zh }}切换布局{{ else }}Toggle layout{{ end }}"
              class="inline-flex items-center gap-1.5 text-sm font-medium text-slate-600 dark:text-zinc-300 border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 hover:border-brand-400 px-3 py-1.5 rounded-lg transition-colors">
        <svg id="ulid-layout-stack" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 4h14v6H5z M5 14h14v6H5z"/></svg>
        <svg id="ulid-layout-col" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 4h6v16H5z M13 4h6v16h-6z"/></svg>
      </button>
      <button id="ulid-fullscreen" type="button" title="{{ if $zh }}切换全屏{{ else }}Toggle fullscreen{{ end }}"
              class="inline-flex items-center gap-1.5 text-sm font-medium text-slate-600 dark:text-zinc-300 border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 hover:border-brand-400 px-3 py-1.5 rounded-lg transition-colors">
        <svg id="ulid-fs-enter" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V6a2 2 0 012-2h2M20 8V6a2 2 0 00-2-2h-2M4 16v2a2 2 0 002 2h2M20 16v2a2 2 0 01-2 2h-2"/></svg>
        <svg id="ulid-fs-exit" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 4v4H4M16 4v4h4M8 20v-4H4M16 20v-4h4"/></svg>
      </button>
    </div>
  </div>

  <div id="ulid-panels" class="flex flex-col lg:flex-row lg:items-start">
    <div id="ulid-left" class="flex flex-col lg:flex-1 border-b lg:border-b-0 lg:border-r border-slate-100 dark:border-zinc-800">
      <div class="px-4 sm:px-5 py-4 space-y-4">
        <div>
          <div class="mb-1.5 flex items-center justify-between text-xs text-slate-600 dark:text-zinc-400">
            <span>{{ if $zh }}生成数量{{ else }}Count{{ end }}</span>
            <input id="ulid-count" type="number" min="1" max="1000" value="10" class="w-20 rounded-lg border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 px-2 py-1 text-sm text-slate-700 dark:text-zinc-200 focus:outline-none focus:ring-2 focus:ring-brand-500 transition-colors" />
          </div>
          <input id="ulid-count-range" type="range" min="1" max="1000" value="10" class="w-full accent-brand-500" />
        </div>
        <button id="ulid-generate" type="button" class="jt-mode active w-full justify-center">{{ if $zh }}生成{{ else }}Generate{{ end }}</button>
        <div class="pt-2 border-t border-slate-100 dark:border-zinc-800">
          <div class="mb-1.5 text-xs text-slate-600 dark:text-zinc-400">{{ if $zh }}解析 ULID 时间戳{{ else }}Decode ULID timestamp{{ end }}</div>
          <div class="flex gap-2">
            <input id="ulid-decode-input" type="text" spellcheck="false" placeholder="01HX2K2Y..." class="flex-1 min-w-0 rounded-lg border border-slate-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 px-3 py-1.5 text-sm text-slate-700 dark:text-zinc-200 focus:outline-none focus:ring-2 focus:ring-brand-500 transition-colors" />
            <button id="ulid-decode" type="button" class="jt-mode">{{ if $zh }}解析{{ else }}Decode{{ end }}</button>
          </div>
          <div id="ulid-decoded" class="mt-2 text-xs text-slate-500 dark:text-zinc-400"></div>
        </div>
      </div>
    </div>

    <div id="ulid-resizer" role="separator" aria-label="{{ if $zh }}拖动调整面板宽度{{ else }}Drag to resize panels{{ end }}" class="hidden lg:flex self-stretch group w-2.5 cursor-col-resize items-center justify-center transition-colors" style="touch-action:none;">
      <span class="flex flex-col gap-1.5" aria-hidden="true">
        <span class="w-1.5 h-1.5 rounded-full bg-slate-400 dark:bg-zinc-500 group-hover:bg-brand-500 dark:group-hover:bg-brand-400 transition-colors"></span>
        <span class="w-1.5 h-1.5 rounded-full bg-slate-400 dark:bg-zinc-500 group-hover:bg-brand-500 dark:group-hover:bg-brand-400 transition-colors"></span>
        <span class="w-1.5 h-1.5 rounded-full bg-slate-400 dark:bg-zinc-500 group-hover:bg-brand-500 dark:group-hover:bg-brand-400 transition-colors"></span>
        <span class="w-1.5 h-1.5 rounded-full bg-slate-400 dark:bg-zinc-500 group-hover:bg-brand-500 dark:group-hover:bg-brand-400 transition-colors"></span>
        <span class="w-1.5 h-1.5 rounded-full bg-slate-400 dark:bg-zinc-500 group-hover:bg-brand-500 dark:group-hover:bg-brand-400 transition-colors"></span>
      </span>
    </div>

    <div id="ulid-right" class="flex flex-col lg:flex-[1.3] min-h-0">
      <div class="px-4 sm:px-5 pt-3 pb-2 flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 dark:border-zinc-800">
        <span class="text-xs font-semibold uppercase tracking-wide text-slate-400 dark:text-zinc-500">{{ if $zh }}输出{{ else }}Output{{ end }}</span>
        <div class="flex items-center gap-1.5">
          <button id="ulid-copy" type="button" class="jt-icon-btn" title="{{ if $zh }}复制输出{{ else }}Copy output{{ end }}">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
          </button>
          <button id="ulid-clear" type="button" class="jt-icon-btn" title="{{ if $zh }}全部清空{{ else }}Clear all{{ end }}">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
          </button>
        </div>
      </div>
      <div id="ulid-statusbar" class="px-4 sm:px-5 pt-2 text-xs flex flex-wrap items-center gap-x-3 gap-y-1 min-h-6">
        <span id="ulid-status" class="text-slate-400 dark:text-zinc-500"></span>
      </div>
      <textarea id="ulid-output" rows="22" readonly spellcheck="false" placeholder="{{ if $zh }}生成的 ULID 将显示在这里…{{ else }}Generated ULIDs will appear here...{{ end }}"
                class="jt-editor jt-output-readonly" style="min-height:320px;"></textarea>
    </div>
  </div>
</div>
<script src="/js/ulid-generator.js?v=1" defer></script>
