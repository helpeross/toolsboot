why_title: "Why ToolsBoot?"
why_1_title: "Privacy by design"
why_1_desc: "Being a static site, ToolsBoot has no backend to funnel your data through. When you paste a value into a tool page, the script processes it in memory and discards it the moment you leave the page."
why_2_title: "Speed you can feel"
why_2_desc: "Pages are hand-tuned to ship as little HTML, CSS, and JavaScript as possible. Most tools respond instantly, so they slot neatly into your flow without breaking your concentration."
why_3_title: "No hand-holding"
why_3_desc: "No sign-ups, no artificial limits, no download prompts. Open a tool, use it, close the tab. That is the whole deal."

