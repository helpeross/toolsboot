  icon: "SC"
  category: Scanners
  desc: "Decode QR codes from images - paste, drag & drop or select multiple pictures."
  desc_zh: "从图片中解码二维码——支持粘贴、拖放或选择多张图片。"

- name: JWT Decoder / Encoder
  name_zh: JWT 编解码
  slug: jwt-decoder
  icon: "JWT"
  category: Encoders
  desc: "Decode JWT headers and payloads, and verify HS256/384/512 signatures locally."
  desc_zh: "本地解码 JWT 头部与载荷，并校验 HS256/384/512 签名。"

- name: Morse Code Translator
  name_zh: 摩斯电码
  slug: morse-code
  icon: "&#8226;&#8212;"
  category: Encoders
  desc: "Translate text to and from Morse code with letter, digit and punctuation support."
  desc_zh: "在文本与摩斯电码之间互转，支持字母、数字与标点。"

- name: RSA Encrypt / Decrypt
  name_zh: RSA 加密/解密
